name: Verify and build release candidate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python backend/tests/run_all.py
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: recognition-production-package
          path: recognition-v*.zip
          if-no-files-found: error
          retention-days: 14
