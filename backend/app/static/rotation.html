<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <title>轮岗（测试）</title>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
