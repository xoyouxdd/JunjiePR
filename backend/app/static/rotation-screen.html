<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102033">
  <meta name="format-detection" content="telephone=no">
  <title>休息室轮岗大屏 · FZ TEAM WORKBENCH</title>
  <link rel="stylesheet" href="../static/css/style.css?v=__STATIC_CACHE_VERSION__">
  <link rel="stylesheet" href="../static/css/rotation.css?v=__STATIC_CACHE_VERSION__">
</head>
<body class="rotation-page rotation-screen">
  <header class="rt-top">
    <div class="rt-title"><strong>热力追踪 · 休息室</strong><small class="rt-brand-en" lang="en">FZ TEAM WORKBENCH</small></div>
    <div class="rt-clock rt-clock-big" id="rtClock" aria-live="off"></div>
    <nav class="rt-screen-summary" id="rtScreenSummary" aria-label="实时待处理人数" hidden>
      <a data-screen-metric="pending" href="#screen-pool-pending"><span class="rt-screen-metric-label">待确认休息</span><strong data-screen-count="pending">0</strong></a>
      <a data-screen-metric="ready" href="#screen-pool-ready"><span class="rt-screen-metric-label">待上岗</span><strong data-screen-count="ready">0</strong></a>
      <a data-screen-metric="exception" href="#screen-pool-exception"><span class="rt-screen-metric-label">已超时</span><strong data-screen-count="exception">0</strong></a>
      <a data-screen-metric="checkin" href="#screen-pool-checkin" hidden><span class="rt-screen-metric-label">待签到</span><strong data-screen-count="checkin">0</strong></a>
    </nav>
    <div class="rt-screen-status">
      <div class="rt-rotation-totals" id="rtScreenTotals" hidden></div>
      <span class="rt-sync" id="rtSync" role="status">正在连接</span>
    </div>
  </header>
  <main class="rt-main" id="rtApp"><section class="empty">正在加载…</section></main>
  <div id="rtModal"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="../static/js/rotation-common.js?v=__STATIC_CACHE_VERSION__"></script>
  <script src="../static/js/rotation-workflow.js?v=__STATIC_CACHE_VERSION__"></script>
  <script src="../static/js/rotation-forecast.js?v=__STATIC_CACHE_VERSION__-early-check-in"></script>
  <script src="../static/js/rotation-screen.js?v=__STATIC_CACHE_VERSION__"></script>
</body>
</html>
