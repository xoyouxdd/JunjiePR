<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#102033">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-title" content="FZ工作台">
  <link rel="canonical" href="https://124.220.229.9:28176/login">
  <link rel="manifest" href="static/manifest.json?v=__STATIC_CACHE_VERSION__">
  <link rel="apple-touch-icon" href="static/images/fzpr-icon.png?v=__STATIC_CACHE_VERSION__">
  <title>FZ团队工作台</title>
  <link rel="stylesheet" href="static/css/style.css?v=__STATIC_CACHE_VERSION__">
</head>
<body class="login-body">
  <main class="login-shell">
    <header class="login-hero">
      <img class="brand-mark" src="static/images/fzpr-icon.png?v=__STATIC_CACHE_VERSION__" alt="FZ Logo" width="72" height="72">
      <p class="login-brand-en" lang="en">FZ TEAM WORKBENCH</p>
      <h1>FZ团队工作台</h1>
      <p class="login-subtitle">团队协作 · 日常运营 · 认可成长</p>
    </header>
    <section class="login-panel">
      <div class="login-welcome"><h2>欢迎回来</h2><p>登录你的团队工作空间</p></div>
      <form id="loginForm" class="form-stack">
        <label>员工号 / 登录账号
          <input name="employee_no" autocomplete="username" autocapitalize="off" spellcheck="false" enterkeyhint="next" required placeholder="请输入登录账号">
        </label>
        <label>密码 / PIN
          <div class="login-password-wrap">
            <input name="password" type="password" autocomplete="current-password" enterkeyhint="go" required placeholder="请输入密码">
            <button type="button" class="login-password-toggle" data-password-toggle aria-label="显示密码" aria-pressed="false">显示</button>
          </div>
        </label>
        <button class="primary" type="submit">登录工作台</button>
      </form>
      <div id="loginMsg" class="message"></div>
      <p class="login-security-note">内部团队使用 · 请妥善保管账号</p>
    </section>
    <footer class="login-footer"><strong>FZ团队工作台</strong><span>让认可被看见，让协作更顺畅。</span></footer>
  </main>
  <script src="static/js/login.js?v=__STATIC_CACHE_VERSION__"></script>
</body>
</html>
